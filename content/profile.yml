about:
  - I've been building websites for about eight years, in agencies and in-house. Most of my client work is hand-crafted. That means custom themes in PHP, Twig and ACF, and frontends written in plain HTML, CSS and JavaScript or TypeScript. WordPress has usually been the CMS underneath, alongside Voog, Squarespace and sites with no CMS at all, but the code on top is mine.
  - As webmaster at Bombay Group I look after several production sites, covering code, content, server and backups. Outside client work I build my own projects, such as a live map of Estonian cinema showtimes, a tactics board for my football team, and 3D browser games in Three.js.
  - Away from the screen, I cycle, play football and padel, and do design for fun in Illustrator and Figma.

